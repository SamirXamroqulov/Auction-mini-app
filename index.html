<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AuctionUZ</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f5f7;
      color: #111827;
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
    }

    .profile {
      background: #e5e7eb;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .auction-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .product-image {
      height: 220px;
      background: #e9e9e9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .image-placeholder {
      font-size: 80px;
    }

    .winner-image-box {
      display: none;
      height: 220px;
      background: #fff7ed;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
    }

    .winner-image-icon {
      font-size: 60px;
    }

    .winner-image-title {
      font-size: 22px;
      font-weight: 800;
      margin-top: 8px;
    }

    .content {
      padding: 18px;
    }

    .product-name {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .description {
      color: #6b7280;
      margin-bottom: 18px;
    }

    .info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .label {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .price {
      font-size: 25px;
      font-weight: 800;
    }

    .timer {
      font-size: 20px;
      font-weight: 700;
    }

    .bid-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .bid-option {
      padding: 12px 8px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      background: white;
      color: #111827;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .bid-option.selected {
      background: #229ed9;
      border-color: #229ed9;
      color: white;
    }

    .bid-option:last-child {
      grid-column: span 2;
    }

    .bid-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #229ed9;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .bid-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      margin-top: 12px;
      color: #16a34a;
      font-weight: 600;
      min-height: 20px;
    }

    .bids-box {
      margin-top: 18px;
      padding: 16px;
      background: #f9fafb;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
    }

    .bids-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .bid-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .bid-item:last-child {
      border-bottom: none;
    }

    .bid-user {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bid-amount {
      font-weight: 800;
      white-space: nowrap;
    }

    .no-bids {
      color: #6b7280;
      text-align: center;
      padding: 8px 0;
    }

    .winner-box {
      display: none;
      margin-top: 16px;
      padding: 18px;
      background: #fff7ed;
      border: 2px solid #f59e0b;
      border-radius: 16px;
      text-align: center;
    }

    .winner-icon {
      font-size: 40px;
    }

    .winner-title {
      font-size: 20px;
      font-weight: 800;
      margin-top: 6px;
    }

    .winner-name {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 700;
    }

    .winner-price {
      margin-top: 6px;
      font-size: 20px;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <div class="header">

    <div class="logo">
      🔨 AuctionUZ
    </div>

    <div class="profile">
      👤 Profil
    </div>

  </div>

  <div class="section-title">
    🔥 Jonli auktsion
  </div>

  <div class="auction-card">

    <div
      class="product-image"
      id="productImage"
    >
      <div class="image-placeholder">
        🎧
      </div>
    </div>

    <div
      class="winner-image-box"
      id="winnerImageBox"
    >
      <div class="winner-image-icon">
        🏆
      </div>

      <div class="winner-image-title">
        Auktsion yakunlandi
      </div>
    </div>

    <div class="content">

      <div class="product-name" id="productName">
        Yuklanmoqda...
      </div>

      <div class="description" id="description">
        Yuklanmoqda...
      </div>

      <div class="info">

        <div>
          <div class="label">
            Hozirgi narx
          </div>

          <div class="price" id="price">
            ...
          </div>
        </div>

        <div>
          <div class="label">
            Tugashiga
          </div>

          <div class="timer" id="timer">
            --:--:--
          </div>
        </div>

      </div>

      <!-- BID MIQDORLARI -->

      <div
        class="bid-options"
        id="bidOptions"
      >

        <button
          type="button"
          class="bid-option"
          data-bid="5000"
        >
          +5 000
        </button>

        <button
          type="button"
          class="bid-option"
          data-bid="10000"
        >
          +10 000
        </button>

        <button
          type="button"
          class="bid-option"
          data-bid="25000"
        >
          +25 000
        </button>

        <button
          type="button"
          class="bid-option"
          data-bid="50000"
        >
          +50 000
        </button>

        <button
          type="button"
          class="bid-option"
          data-bid="100000"
        >
          +100 000
        </button>

      </div>

      <button
        class="bid-button"
        id="bidButton"
        disabled
      >
        💰 Taklif miqdorini tanlang
      </button>

      <div
        class="message"
        id="message"
      ></div>

      <div class="bids-box">

        <div class="bids-title">
          👥 Takliflar
        </div>

        <div id="bidsList">

          <div class="no-bids">
            Hali taklif yo‘q
          </div>

        </div>

      </div>

      <!-- G'OLIB -->

      <div
        class="winner-box"
        id="winnerBox"
      >

        <div class="winner-icon">
          🏆
        </div>

        <div class="winner-title">
          Auktsion tugadi!
        </div>

        <div
          class="winner-name"
          id="winnerName"
        ></div>

        <div
          class="winner-price"
          id="winnerPrice"
        ></div>

      </div>

    </div>

  </div>


  <script>

    // ==============================
    // SUPABASE
    // ==============================

    const SUPABASE_URL =
      "https://ehpbruqswebpenepcmte.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_pN-XXonPqbmYlX3NeQt4nQ_WOo-0ZNH";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==============================
    // TELEGRAM
    // ==============================

    const tg =
      window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const telegramUser =
      tg.initDataUnsafe?.user;

    if (telegramUser) {

      const profileName =
        telegramUser.username
          ? "@" + telegramUser.username
          : (
              telegramUser.first_name ||
              "Foydalanuvchi"
            );

      document.querySelector(
        ".profile"
      ).textContent =
        "👤 " + profileName;
    }


    // ==============================
    // ELEMENTS
    // ==============================

    const priceElement =
      document.getElementById("price");

    const timerElement =
      document.getElementById("timer");

    const button =
      document.getElementById("bidButton");

    const message =
      document.getElementById("message");

    const productName =
      document.getElementById("productName");

    const description =
      document.getElementById("description");

    const bidsList =
      document.getElementById("bidsList");

    const winnerBox =
      document.getElementById("winnerBox");

    const winnerName =
      document.getElementById("winnerName");

    const winnerPrice =
      document.getElementById("winnerPrice");

    const productImage =
      document.getElementById("productImage");

    const winnerImageBox =
      document.getElementById("winnerImageBox");

    const bidOptions =
      document.querySelectorAll(".bid-option");


    // ==============================
    // STATE
    // ==============================

    let auction = null;

    let timeLeft = 0;

    let selectedBid = null;


    // ==============================
    // PRICE
    // ==============================

    function showPrice(price) {

      const number =
        Number(price) || 0;

      priceElement.textContent =
        number.toLocaleString("uz-UZ") +
        " so‘m";
    }


    // ==============================
    // PRODUCT IMAGE
    // ==============================

    function showProductImage(url) {

      productImage.innerHTML = "";

      if (!url) {

        const placeholder =
          document.createElement("div");

        placeholder.className =
          "image-placeholder";

        placeholder.textContent =
          "🎧";

        productImage.appendChild(
          placeholder
        );

        return;
      }

      const img =
        document.createElement("img");

      img.src = url;

      img.alt =
        auction?.product_name ||
        "Mahsulot rasmi";

      img.onerror =
        function() {

          productImage.innerHTML =
            '<div class="image-placeholder">🎧</div>';

        };

      productImage.appendChild(img);
    }


    // ==============================
    // BID OPTION
    // ==============================

    bidOptions.forEach(
      function(option) {

        option.addEventListener(
          "click",
          function() {

            if (
              !auction ||
              timeLeft <= 0
            ) {
              return;
            }

            bidOptions.forEach(
              function(item) {

                item.classList.remove(
                  "selected"
                );

              }
            );

            option.classList.add(
              "selected"
            );

            selectedBid =
              Number(
                option.dataset.bid
              );

            button.disabled =
              false;

            button.textContent =
              "💰 +" +
              selectedBid.toLocaleString(
                "uz-UZ"
              ) +
              " so‘m taklif qilish";

          }
        );

      }
    );


    // ==============================
    // LOAD BIDS
    // ==============================

    async function loadBids() {

      if (!auction) {
        return;
      }

      const {
        data,
        error
      } =
        await supabaseClient
          .from("bids")
          .select(
            "username, amount, created_at"
          )
          .eq(
            "auction_id",
            auction.id
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );

      if (error) {

        console.error(
          "Bids yuklash xatosi:",
          error
        );

        bidsList.innerHTML =
          '<div class="no-bids">Takliflarni yuklashda xato</div>';

        return;
      }

      bidsList.innerHTML = "";

      if (
        !data ||
        data.length === 0
      ) {

        bidsList.innerHTML =
          '<div class="no-bids">Hali taklif yo‘q</div>';

        return;
      }

      data.forEach(
        function(bid, index) {

          const item =
            document.createElement("div");

          item.className =
            "bid-item";

          const user =
            document.createElement("div");

          user.className =
            "bid-user";

          user.textContent =
            (index + 1) +
            ". " +
            (
              bid.username ||
              "Foydalanuvchi"
            );

          const amount =
            document.createElement("div");

          amount.className =
            "bid-amount";

          amount.textContent =
            Number(
              bid.amount
            ).toLocaleString(
              "uz-UZ"
            ) +
            " so‘m";

          item.appendChild(user);

          item.appendChild(amount);

          bidsList.appendChild(item);

        }
      );

    }


    // ==============================
    // WINNER
    // ==============================

    async function showWinner() {

      if (!auction) {
        return;
      }

      if (
        winnerBox.style.display ===
        "block"
      ) {
        return;
      }

      // RASM O'RNIGA G'OLIB OYNASI

      productImage.style.display =
        "none";

      winnerImageBox.style.display =
        "flex";


      const {
        data,
        error
      } =
        await supabaseClient
          .from("bids")
          .select(
            "username, amount, created_at"
          )
          .eq(
            "auction_id",
            auction.id
          )
          .order(
            "amount",
            {
              ascending: false
            }
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          )
          .limit(1)
          .maybeSingle();

      if (error) {

        console.error(
          "Winner xatosi:",
          error
        );

        return;
      }

      winnerBox.style.display =
        "block";

      if (!data) {

        winnerName.textContent =
          "Hech kim taklif bermadi.";

        winnerPrice.textContent =
          "";

        return;
      }

      winnerName.textContent =
        "🥇 G‘olib: " +
        (
          data.username ||
          "Foydalanuvchi"
        );

      winnerPrice.textContent =
        Number(
          data.amount
        ).toLocaleString(
          "uz-UZ"
        ) +
        " so‘m";
    }


    // ==============================
    // TIMER
    // ==============================

    function updateTimer() {

      if (
        !auction ||
        !auction.ends_at
      ) {
        return;
      }

      const endTime =
        new Date(
          auction.ends_at
        ).getTime();

      const now =
        Date.now();

      timeLeft =
        Math.max(
          0,
          Math.floor(
            (
              endTime - now
            ) / 1000
          )
        );

      const hours =
        Math.floor(
          timeLeft / 3600
        );

      const minutes =
        Math.floor(
          (timeLeft % 3600) / 60
        );

      const seconds =
        timeLeft % 60;

      timerElement.textContent =
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");


      if (timeLeft <= 0) {

        button.disabled = true;

        button.textContent =
          "⏰ Auktsion tugadi";

        bidOptions.forEach(
          function(option) {
            option.disabled = true;
          }
        );

        showWinner();

      } else {

        bidOptions.forEach(
          function(option) {
            option.disabled = false;
          }
        );

        if (selectedBid) {

          button.disabled = false;

          button.textContent =
            "💰 +" +
            selectedBid.toLocaleString(
              "uz-UZ"
            ) +
            " so‘m taklif qilish";

        } else {

          button.disabled = true;

          button.textContent =
            "💰 Taklif miqdorini tanlang";

        }

      }

    }


    // ==============================
    // LOAD AUCTION
    // ==============================

    async function loadAuction() {

      message.textContent =
        "Auktsion yuklanmoqda...";

      const {
        data,
        error
      } =
        await supabaseClient
          .from("auctions")
          .select("*")
          .order(
            "id",
            {
              ascending: false
            }
          )
          .limit(1)
          .single();

      if (error) {

        console.error(
          "Auction xatosi:",
          error
        );

        message.textContent =
          "❌ Auktsionni yuklashda xato";

        return;
      }

      auction = data;

      productName.textContent =
        auction.product_name ||
        "Mahsulot";

      description.textContent =
        auction.description ||
        "";

      showPrice(
        auction.current_price
      );

      // RASM

      showProductImage(
        auction.image_url
      );

      productImage.style.display =
        "flex";

      winnerImageBox.style.display =
        "none";

      winnerBox.style.display =
        "none";

      winnerName.textContent = "";

      winnerPrice.textContent = "";

      // BID TANLOVINI TOZALASH

      selectedBid = null;

      bidOptions.forEach(
        function(option) {

          option.classList.remove(
            "selected"
          );

          option.disabled = false;

        }
      );

      button.disabled = true;

      button.textContent =
        "💰 Taklif miqdorini tanlang";

      message.textContent = "";

      await loadBids();

      updateTimer();

    }


    // ==============================
    // PLACE BID
    // ==============================

    async function placeBid() {

      if (!auction) {
        return;
      }

      if (timeLeft <= 0) {
        return;
      }

      if (!selectedBid) {

        message.textContent =
          "⚠️ Avval taklif miqdorini tanlang";

        return;
      }

      button.disabled = true;

      message.textContent =
        "⏳ Taklif yuborilmoqda...";


      const newPrice =
        Number(
          auction.current_price
        ) +
        Number(
          selectedBid
        );


      // ==============================
      // UPDATE AUCTION PRICE
      // ==============================

      const {
        data,
        error
      } =
        await supabaseClient
          .from("auctions")
          .update({
            current_price: newPrice
          })
          .eq(
            "id",
            auction.id
          )
          .select()
          .single();

      if (error) {

        console.error(
          "Auction update xatosi:",
          error
        );

        message.textContent =
          "❌ Taklif yuborilmadi";

        button.disabled = false;

        return;
      }

      auction = data;

      showPrice(
        auction.current_price
      );


      // ==============================
      // TELEGRAM USER
      // ==============================

      const user =
        tg.initDataUnsafe?.user;

      if (!user?.id) {

        console.error(
          "Telegram user ID topilmadi"
        );

        message.textContent =
          "❌ Telegram foydalanuvchisi aniqlanmadi";

        button.disabled = false;

        return;
      }

      const userTelegramId =
        Number(user.id);

      const userUsername =
        user?.username
          ? "@" + user.username
          : (
              user?.first_name ||
              "Foydalanuvchi"
            );


      // ==============================
      // SAVE BID
      // ==============================

      const {
        error: bidError
      } =
        await supabaseClient
          .from("bids")
          .insert({

            auction_id:
              auction.id,

            telegram_user_id:
              userTelegramId,

            username:
              userUsername,

            amount:
              Number(
                auction.current_price
              )

          });


      if (bidError) {

        console.error(
          "Bid saqlash xatosi:",
          bidError
        );

        message.textContent =
          "❌ Bid saqlanmadi: " +
          (
            bidError.message ||
            "Noma’lum xato"
          );

        button.disabled = false;

        return;
      }

      message.textContent =
        "✅ Taklifingiz qabul qilindi!";

      await loadBids();

      updateTimer();

    }


    // ==============================
    // BID BUTTON
    // ==============================

    button.addEventListener(
      "click",
      placeBid
    );


    // ==============================
    // REALTIME AUCTION
    // ==============================

    supabaseClient
      .channel("auction-live")

      .on(
        "postgres_changes",
        {
          event: "UPDATE",
          schema: "public",
          table: "auctions"
        },

        function(payload) {

          console.log(
            "Yangi auction ma'lumoti:",
            payload.new
          );

          if (
            auction &&
            payload.new.id ===
              auction.id
          ) {

            auction =
              payload.new;

            showPrice(
              auction.current_price
            );

            if (
              payload.new.image_url
            ) {

              showProductImage(
                payload.new.image_url
              );

            }

            updateTimer();

            loadBids();

          }

        }
      )

      // ==============================
      // YANGI AUCTION
      // ==============================

      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "auctions"
        },

        function(payload) {

          console.log(
            "Yangi auktsion yaratildi:",
            payload.new
          );

          loadAuction();

        }
      )

      .subscribe(
        function(status) {

          console.log(
            "Auction realtime:",
            status
          );

        }
      );


    // ==============================
    // REALTIME BIDS
    // ==============================

    supabaseClient
      .channel("bids-live")

      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "bids"
        },

        function(payload) {

          console.log(
            "Yangi bid:",
            payload.new
          );

          if (
            auction &&
            payload.new.auction_id ===
              auction.id
          ) {

            loadBids();

          }

        }
      )

      .subscribe(
        function(status) {

          console.log(
            "Bids realtime:",
            status
          );

        }
      );


    // ==============================
    // START
    // ==============================

    loadAuction();


    setInterval(
      updateTimer,
      1000
    );

  </script>

</body>
</html>
