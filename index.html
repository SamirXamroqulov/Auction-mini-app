<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AuctionUZ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f5f7;
      color: #111827;
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
    }

    .profile {
      background: #e5e7eb;
      padding: 8px 12px;
      border-radius: 12px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .auction-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .product-image {
      height: 220px;
      background: #e9e9e9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
    }

    .content {
      padding: 18px;
    }

    .product-name {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .description {
      color: #6b7280;
      margin-bottom: 18px;
    }

    .info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .label {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .price {
      font-size: 25px;
      font-weight: 800;
    }

    .timer {
      font-size: 20px;
      font-weight: 700;
    }

    .bid-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #229ed9;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .bid-button:active {
      transform: scale(0.98);
    }

    .message {
      text-align: center;
      margin-top: 12px;
      color: #16a34a;
      font-weight: 600;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">🔨 AuctionUZ</div>
    <div class="profile">👤 Profil</div>
  </div>

  <div class="section-title">
    🔥 Jonli auktsion
  </div>

  <div class="auction-card">

    <div class="product-image">
      🎧
    </div>

    <div class="content">

      <div class="product-name">
        Wireless Headphones
      </div>

      <div class="description">
        Yangi mahsulot · 1 dona
      </div>

      <div class="info">

        <div>
          <div class="label">
            Hozirgi narx
          </div>

          <div class="price" id="price">
            100 000 so‘m
          </div>
        </div>

        <div>
          <div class="label">
            Tugashiga
          </div>

          <div class="timer" id="timer">
            02:00:00
          </div>
        </div>

      </div>

      <button class="bid-button" id="bidButton">
        💰 +5 000 so‘m taklif qilish
      </button>

      <div class="message" id="message"></div>

    </div>
  </div>

  <script>

    let price = 100000;

    let timeLeft = 7200;

    const priceElement =
      document.getElementById("price");

    const timerElement =
      document.getElementById("timer");

    const button =
      document.getElementById("bidButton");

    const message =
      document.getElementById("message");


    function updateTimer() {

      let hours =
        Math.floor(timeLeft / 3600);

      let minutes =
        Math.floor((timeLeft % 3600) / 60);

      let seconds =
        timeLeft % 60;

      hours =
        String(hours).padStart(2, "0");

      minutes =
        String(minutes).padStart(2, "0");

      seconds =
        String(seconds).padStart(2, "0");

      timerElement.textContent =
        hours + ":" + minutes + ":" + seconds;

      if (timeLeft > 0) {

        timeLeft--;

      } else {

        button.disabled = true;

        button.textContent =
          "⏰ Auktsion tugadi";

      }

    }


    button.addEventListener("click", function() {

      if (timeLeft <= 0) {
        return;
      }

      price += 5000;

      priceElement.textContent =
        price.toLocaleString("uz-UZ") + " so‘m";

      message.textContent =
        "✅ Taklifingiz qabul qilindi!";

    });


    updateTimer();

    setInterval(updateTimer, 1000);
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const user = tg.initDataUnsafe?.user;

if (user) {
  document.querySelector(".profile").textContent =
    "👤 " + (user.first_name || "Foydalanuvchi");
}
 
  </script>
  
</body>
</html>
