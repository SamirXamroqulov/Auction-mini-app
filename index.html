<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AuctionUZ</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f5f7;
      color: #111827;
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
    }

    .profile {
      background: #e5e7eb;
      padding: 8px 12px;
      border-radius: 12px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .auction-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .product-image {
      height: 220px;
      background: #e9e9e9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
    }

    .content {
      padding: 18px;
    }

    .product-name {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .description {
      color: #6b7280;
      margin-bottom: 18px;
    }

    .info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .label {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .price {
      font-size: 25px;
      font-weight: 800;
    }

    .timer {
      font-size: 20px;
      font-weight: 700;
    }

    .bid-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #229ed9;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .bid-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      margin-top: 12px;
      color: #16a34a;
      font-weight: 600;
      min-height: 20px;
    }

    /* ==============================
       BIDS LIST
       ============================== */

    .bids-box {
      margin-top: 18px;
      padding: 16px;
      background: #f9fafb;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
    }

    .bids-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .bid-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .bid-item:last-child {
      border-bottom: none;
    }

    .bid-user {
      font-weight: 700;
    }

    .bid-amount {
      font-weight: 800;
    }

    .no-bids {
      color: #6b7280;
      text-align: center;
      padding: 8px 0;
    }

    /* ==============================
       WINNER BOX
       ============================== */

    .winner-box {
      display: none;
      margin-top: 16px;
      padding: 18px;
      background: #fff7ed;
      border: 2px solid #f59e0b;
      border-radius: 16px;
      text-align: center;
    }

    .winner-icon {
      font-size: 40px;
    }

    .winner-title {
      font-size: 20px;
      font-weight: 800;
      margin-top: 6px;
    }

    .winner-name {
      margin-top: 10px;
      font-size: 18px;
      font-weight: 700;
    }

    .winner-price {
      margin-top: 6px;
      font-size: 20px;
      font-weight: 800;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">🔨 AuctionUZ</div>
    <div class="profile">👤 Profil</div>
  </div>

  <div class="section-title">
    🔥 Jonli auktsion
  </div>

  <div class="auction-card">

    <div class="product-image">
      🎧
    </div>

    <div class="content">

      <div class="product-name" id="productName">
        Yuklanmoqda...
      </div>

      <div class="description" id="description">
        Yuklanmoqda...
      </div>

      <div class="info">

        <div>
          <div class="label">
            Hozirgi narx
          </div>

          <div class="price" id="price">
            ...
          </div>
        </div>

        <div>
          <div class="label">
            Tugashiga
          </div>

          <div class="timer" id="timer">
            --:--:--
          </div>
        </div>

      </div>

      <button class="bid-button" id="bidButton" disabled>
        💰 +5 000 so‘m taklif qilish
      </button>

      <div class="message" id="message"></div>


      <!-- ==============================
           BIDS LIST
           ============================== -->

      <div class="bids-box">

        <div class="bids-title">
          👥 Takliflar
        </div>

        <div id="bidsList">
          <div class="no-bids">
            Hali taklif yo‘q
          </div>
        </div>

      </div>


      <!-- ==============================
           WINNER
           ============================== -->

      <div class="winner-box" id="winnerBox">

        <div class="winner-icon">
          🏆
        </div>

        <div class="winner-title">
          Auktsion tugadi!
        </div>

        <div class="winner-name" id="winnerName">
        </div>

        <div class="winner-price" id="winnerPrice">
        </div>

      </div>

    </div>
  </div>

  <script>

    // ==============================
    // SUPABASE
    // ==============================

    const SUPABASE_URL =
      "https://ehpbruqswebpenepcmte.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_pN-XXonPqbmYlX3NeQt4nQ_WOo-0ZNH";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==============================
    // TELEGRAM
    // ==============================

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const telegramUser =
      tg.initDataUnsafe?.user;

    if (telegramUser) {

      const telegramName =
        telegramUser.username
          ? "@" + telegramUser.username
          : (telegramUser.first_name || "Foydalanuvchi");

      document.querySelector(".profile").textContent =
        "👤 " + telegramName;
    }


    // ==============================
    // ELEMENTS
    // ==============================

    const priceElement =
      document.getElementById("price");

    const timerElement =
      document.getElementById("timer");

    const button =
      document.getElementById("bidButton");

    const message =
      document.getElementById("message");

    const productName =
      document.getElementById("productName");

    const description =
      document.getElementById("description");

    const bidsList =
      document.getElementById("bidsList");

    const winnerBox =
      document.getElementById("winnerBox");

    const winnerName =
      document.getElementById("winnerName");

    const winnerPrice =
      document.getElementById("winnerPrice");


    // ==============================
    // AUCTION STATE
    // ==============================

    let auction = null;
    let timeLeft = 0;


    // ==============================
    // PRICE DISPLAY
    // ==============================

    function showPrice(price) {

      const number =
        Number(price) || 0;

      priceElement.textContent =
        number.toLocaleString("uz-UZ") +
        " so‘m";
    }


    // ==============================
    // LOAD BIDS
    // ==============================

    async function loadBids() {

      if (!auction) {
        return;
      }

      const { data, error } =
        await supabaseClient
          .from("bids")
          .select(
            "user_name, username, amount, created_at"
          )
          .eq(
            "auction_id",
            auction.id
          )
          .order(
            "amount",
            {
              ascending: false
            }
          );

      if (error) {

        console.error(
          "Bids yuklash xatosi:",
          error
        );

        return;
      }


      bidsList.innerHTML = "";


      if (!data || data.length === 0) {

        bidsList.innerHTML =
          '<div class="no-bids">Hali taklif yo‘q</div>';

        return;
      }


      data.forEach(function(bid) {

        const item =
          document.createElement("div");

        item.className =
          "bid-item";


        const user =
          document.createElement("div");

        user.className =
          "bid-user";


        const displayName =
          bid.username
            ? "@" + bid.username
            : (
                bid.user_name ||
                "Foydalanuvchi"
              );

        user.textContent =
          displayName;


        const amount =
          document.createElement("div");

        amount.className =
          "bid-amount";

        amount.textContent =
          Number(
            bid.amount
          ).toLocaleString("uz-UZ") +
          " so‘m";


        item.appendChild(user);

        item.appendChild(amount);

        bidsList.appendChild(item);
      });
    }


    // ==============================
    // SHOW WINNER
    // ==============================

    async function showWinner() {

      if (!auction) {
        return;
      }

      if (
        winnerBox.style.display === "block"
      ) {
        return;
      }


      const { data, error } =
        await supabaseClient
          .from("bids")
          .select(
            "user_name, username, amount"
          )
          .eq(
            "auction_id",
            auction.id
          )
          .order(
            "amount",
            {
              ascending: false
            }
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          )
          .limit(1)
          .maybeSingle();


      if (error) {

        console.error(
          "Winner xatosi:",
          error
        );

        return;
      }


      winnerBox.style.display =
        "block";


      if (!data) {

        winnerName.textContent =
          "Hech kim taklif bermadi.";

        winnerPrice.textContent =
          "";

        return;
      }


      const displayName =
        data.username
          ? "@" + data.username
          : (
              data.user_name ||
              "Foydalanuvchi"
            );


      winnerName.textContent =
        "🥇 G‘olib: " +
        displayName;


      winnerPrice.textContent =
        Number(
          data.amount
        ).toLocaleString("uz-UZ") +
        " so‘m";
    }


    // ==============================
    // TIMER
    // ==============================

    function updateTimer() {

      if (!auction || !auction.ends_at) {
        return;
      }


      const endTime =
        new Date(
          auction.ends_at
        ).getTime();


      const now =
        Date.now();


      timeLeft =
        Math.max(
          0,
          Math.floor(
            (endTime - now) / 1000
          )
        );


      let hours =
        Math.floor(
          timeLeft / 3600
        );


      let minutes =
        Math.floor(
          (timeLeft % 3600) / 60
        );


      let seconds =
        timeLeft % 60;


      timerElement.textContent =
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");


      if (timeLeft <= 0) {

        button.disabled = true;

        button.textContent =
          "⏰ Auktsion tugadi";


        showWinner();


      } else {

        button.disabled = false;

        button.textContent =
          "💰 +5 000 so‘m taklif qilish";
      }
    }


    // ==============================
    // LOAD AUCTION
    // ==============================

    async function loadAuction() {

      message.textContent =
        "Auktsion yuklanmoqda...";


      const { data, error } =
        await supabaseClient
          .from("auctions")
          .select("*")
          .limit(1)
          .single();


      if (error) {

        console.error(error);

        message.textContent =
          "❌ Auktsionni yuklashda xato";

        return;
      }


      auction = data;


      productName.textContent =
        auction.product_name ||
        "Mahsulot";


      description.textContent =
        auction.description ||
        "";


      showPrice(
        auction.current_price
      );


      message.textContent =
        "";


      await loadBids();


      updateTimer();
    }


    // ==============================
    // BID
    // ==============================

    async function placeBid() {

      if (!auction) {
        return;
      }


      if (timeLeft <= 0) {
        return;
      }


      button.disabled = true;


      message.textContent =
        "⏳ Taklif yuborilmoqda...";


      const newPrice =
        Number(
          auction.current_price
        ) + 5000;


      const { data, error } =
        await supabaseClient
          .from("auctions")
          .update({
            current_price: newPrice
          })
          .eq(
            "id",
            auction.id
          )
          .select()
          .single();


      if (error) {

        console.error(error);


        message.textContent =
          "❌ Taklif yuborilmadi";


        button.disabled =
          false;


        return;
      }


      // Bazadan qaytgan haqiqiy narx
      auction = data;


      showPrice(
        auction.current_price
      );


      // ==============================
      // TELEGRAM USER
      // ==============================

      const user =
        tg.initDataUnsafe?.user;


      const userId =
        user?.id
          ? String(user.id)
          : "unknown";


      const userName =
        user?.first_name ||
        "Foydalanuvchi";


      const username =
        user?.username ||
        null;


      // ==============================
      // BID HISTORY
      // ==============================

      const { error: bidError } =
        await supabaseClient
          .from("bids")
          .insert({

            auction_id:
              auction.id,

            user_id:
              userId,

            user_name:
              userName,

            username:
              username,

            amount:
              auction.current_price

          });


      if (bidError) {

        console.error(
          "Bid saqlash xatosi:",
          bidError
        );


        message.textContent =
          "⚠️ Narx saqlandi, lekin bid tarixi saqlanmadi";


      } else {

        message.textContent =
          "✅ Taklifingiz qabul qilindi!";


        await loadBids();
      }


      updateTimer();
    }


    button.addEventListener(
      "click",
      placeBid
    );


    // ==============================
    // REALTIME AUCTION
    // ==============================

    supabaseClient
      .channel("auction-live")

      .on(
        "postgres_changes",
        {
          event: "UPDATE",
          schema: "public",
          table: "auctions"
        },

        function(payload) {

          console.log(
            "Yangi auction ma'lumoti:",
            payload.new
          );


          // Faqat biz ochgan auction
          if (
            auction &&
            payload.new.id === auction.id
          ) {

            auction =
              payload.new;


            showPrice(
              auction.current_price
            );


            updateTimer();


            message.textContent =
              "🔄 Narx yangilandi";
          }
        }
      )

      .subscribe(
        function(status) {

          console.log(
            "Realtime:",
            status
          );

        }
      );


    // ==============================
    // REALTIME BIDS
    // ==============================

    supabaseClient
      .channel("bids-live")

      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "bids"
        },

        function(payload) {

          console.log(
            "Yangi bid:",
            payload.new
          );


          if (
            auction &&
            payload.new.auction_id === auction.id
          ) {

            loadBids();
          }
        }
      )

      .subscribe(
        function(status) {

          console.log(
            "Bids realtime:",
            status
          );

        }
      );


    // ==============================
    // START
    // ==============================

    loadAuction();


    setInterval(
      updateTimer,
      1000
    );

  </script>

</body>
</html>
